<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>麻將接龍 - Telegram Mini App</title>
  
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  
  <!-- Adsgram SDK -->
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #game-container {
      width: 100%;
      max-width: 480px;
      height: 100%;
      position: relative;
      background: #16213e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      text-align: center;
      font-size: 14px;
      opacity: 0.8;
      z-index: 10;
    }
    #board {
      width: 90%;
      aspect-ratio: 1;
      background: #0f3460;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #aaa;
    }
    .btn {
      margin-top: 20px;
      padding: 12px 28px;
      background: #e94560;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:active { transform: scale(0.97); }
    .btn.secondary {
      background: #533483;
      margin-left: 10px;
    }
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    #modal.show { display: flex; }
    .modal-content {
      background: #1a1a2e;
      padding: 24px;
      border-radius: 16px;
      text-align: center;
      max-width: 320px;
      width: 90%;
    }
    .modal-content h2 { margin-bottom: 12px; }
    .modal-content p { margin-bottom: 20px; opacity: 0.85; font-size: 15px; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="status">載入中...</div>
    <div id="board">麻將棋盤區域<br>（之後放真實牌面）</div>
    <div style="margin-top: 24px;">
      <button class="btn" id="btn-shuffle">手動洗牌（測試）</button>
      <button class="btn secondary" id="btn-stuck">模擬卡關</button>
    </div>
  </div>

  <!-- 卡關彈窗 -->
  <div id="modal">
    <div class="modal-content">
      <h2>無解了！</h2>
      <p>觀看一段短影片即可免費重新洗牌</p>
      <button class="btn" id="btn-watch-ad">觀看廣告洗牌</button>
      <button class="btn secondary" id="btn-close-modal" style="margin-top:10px;">稍後再說</button>
    </div>
  </div>

  <script>
    // ========== Telegram WebApp 初始化 ==========
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();
    // 可選：tg.disableVerticalSwipes();

    const user = tg.initDataUnsafe?.user;
    const statusEl = document.getElementById('status');
    if (user) {
      statusEl.textContent = `玩家：${user.first_name || user.username || user.id}`;
    } else {
      statusEl.textContent = '桌面測試模式（無 Telegram 用戶）';
    }

    // ========== Adsgram 初始化 ==========
    let AdController = null;
    try {
      // 請替換成你自己的 blockId（從 partner.adsgram.ai 取得）
      AdController = window.Adsgram.init({
        blockId: 'YOUR-BLOCK-ID-HERE',
        debug: true
      });
      console.log('Adsgram 初始化成功');
    } catch (e) {
      console.warn('Adsgram 尚未載入或 blockId 未設定', e);
    }

    // ========== 遊戲狀態（之後換成真實邏輯） ==========
    let isStuck = false;

    function showStuckModal() {
      isStuck = true;
      document.getElementById('modal').classList.add('show');
    }

    function hideStuckModal() {
      document.getElementById('modal').classList.remove('show');
    }

    function shuffleBoard() {
      // TODO: 呼叫真實的洗牌邏輯
      console.log('執行洗牌...');
      statusEl.textContent = '已重新洗牌！';
      isStuck = false;
      hideStuckModal();
      // 模擬更新棋盤
      document.getElementById('board').innerHTML = '新棋盤已生成<br>（之後放真實牌面）';
    }

    // ========== 廣告播放 ==========
    function showRewardedAd() {
      if (!AdController) {
        alert('Adsgram 尚未設定 blockId，目前直接給你洗牌（測試模式）');
        shuffleBoard();
        return;
      }

      // 暫停遊戲（之後用 Phaser 的 pause）
      statusEl.textContent = '廣告播放中...';

      AdController.show()
        .then((result) => {
          console.log('Reward granted', result);
          shuffleBoard();
        })
        .catch((result) => {
          console.log('Ad skipped or error', result);
          statusEl.textContent = '觀看未完成，請再試一次';
          // 可選：提供 Stars 支付備案
        });
    }

    // ========== 事件綁定 ==========
    document.getElementById('btn-stuck').addEventListener('click', showStuckModal);
    document.getElementById('btn-shuffle').addEventListener('click', shuffleBoard);
    document.getElementById('btn-watch-ad').addEventListener('click', showRewardedAd);
    document.getElementById('btn-close-modal').addEventListener('click', hideStuckModal);

    // 模擬遊戲每步檢查無解（之後放到真實消除後）
    // if (hasValidMoves() === false) showStuckModal();
  </script>
</body>
</html>
