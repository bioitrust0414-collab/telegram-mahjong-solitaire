<!DOCTYPE html>
<html lang="zh-Hant">
<head>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <link rel="stylesheet" href="style.css">

<body>
  <div id="app">

    <main id="game-wrapper">

    </main>

    <footer id="footer">
      <button id="levelSelectBtn" class="btn">關卡</button>
      <button id="hintButton" class="btn">提示</button>
      <button id="restartButton" class="btn primary">重來</button>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>

    if (window.Telegram?.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
      const user = tg.initDataUnsafe?.user;
      if (user) {
        // 可顯示用戶名
      }
    }
  </script>
