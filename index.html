<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>麻將接龍</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header id="header">
      <div id="user-info">
        <span class="level-title">麻將接龍</span>
      </div>
      <div id="statusText">載入中...</div>
    </header>

    <div id="main-area">
      <!-- 可旋轉 3D 結構預覽 -->
      <aside id="structure-panel">
        <div class="panel-title">3D 結構</div>
        <div id="scene-3d">
          <div id="cube-world"></div>
        </div>
        <div id="layer-label">—</div>
        <div class="hint-rotate">拖曳旋轉</div>
      </aside>

      <main id="game-wrapper">
        <!-- 關卡選擇或遊戲 -->
      </main>
    </div>

    <footer id="footer">
      <button id="levelSelectBtn" class="btn">關卡</button>
      <button id="hintButton" class="btn">提示</button>
      <button id="restartButton" class="btn primary">重來</button>
    </footer>
  </div>

  <script type="module" src="./main.js"></script>
  
  <script>
    if (window.Telegram?.WebApp) {
      const tg = window.Telegram.WebApp;
      tg.ready();
      tg.expand();
    }
  </script>
</body>
</html>
